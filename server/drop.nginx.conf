# Drop gallery - nginx site. install.sh puts this in /etc/nginx/sites-available/drop.
#
# The gallery has NO login of its own. It listens on 127.0.0.1 only, and you put an access
# layer in front of it: Cloudflare Tunnel + Access, or Tailscale Serve. See docs/.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /srv/drop/site;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;   # nothing is uploaded over HTTP; uploads use SSH/SFTP

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # index + page must always be fresh
    location = /index.json { add_header Cache-Control "no-store"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; }

    # Items are content-addressed (id = file hash), so they can be cached forever.
    # (A nested location replaces all add_header lines, so each block repeats the ones it needs.)
    location /i/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        autoindex off;
        try_files $uri =404;   # static files get Range support, so phones can seek in videos

        # Files that can run script get an opaque origin: a dropped report can run its own
        # scripts but cannot read or script the gallery around it. PDFs and media stay unsandboxed
        # so the browser's built-in viewers keep working.
        location ~* \.(html?|xhtml|svgz?|xml)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-downloads; frame-ancestors 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            try_files $uri =404;
        }
    }
    location ~ /\.      { deny all; }
    location ~ \.tmp$   { deny all; }
    location / { try_files $uri $uri/ =404; }
}

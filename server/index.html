<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#11111b">
<meta name="robots" content="noindex,nofollow">
<title>Drop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='8' width='44' height='32' rx='3' fill='%231e1e2e' stroke='%2389b4fa' stroke-width='3'/%3E%3Cellipse cx='25' cy='17' rx='6' ry='4' fill='%2311111b' stroke='%23cdd6f4' stroke-width='1.5'/%3E%3Cellipse cx='39' cy='17' rx='6' ry='4' fill='%2311111b' stroke='%23cdd6f4' stroke-width='1.5'/%3E%3Cline x1='16' y1='28' x2='40' y2='28' stroke='%23a6e3a1' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='22' y='44' width='20' height='4' rx='1' fill='%23585b70'/%3E%3C/svg%3E">
<style>
/* Drop by KCCS. Catppuccin Mocha tokens, kept on the darkest grounds so nothing big is bright. */
:root{
  color-scheme:dark;background:#11111b;
  --crust:#11111b;--mantle:#181825;--base:#1e1e2e;--s0:#313244;--s1:#45475a;
  --text:#cdd6f4;--sub:#bac2de;--muted:#9399b2;--blue:#89b4fa;--teal:#94e2d5;--mauve:#cba6f7;
  --line:rgba(205,214,244,.10);--focus:#89b4fa;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--crust);color:var(--sub);font:15px/1.45 var(--sans)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--mantle);border-bottom:1px solid var(--line);padding:10px 12px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.brand svg{flex:0 0 auto}
h1{margin:0;font-size:17px;font-weight:600;color:var(--text);letter-spacing:.2px}
#count{color:var(--muted);font-size:12px;font-family:var(--mono);margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--base);color:var(--sub);border:1px solid var(--s0);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
input{flex:1 1 150px}
input::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;background:var(--base);border:1px solid var(--s0);color:var(--muted);border-radius:999px;padding:5px 11px;font:13px var(--sans);cursor:pointer}
.chip.on{background:#1f2a3d;border-color:var(--blue);color:var(--text)}
main{padding:10px 12px 64px;max-width:1500px;margin:0 auto}
h2{font:600 11.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--mantle);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.card .th{position:relative;aspect-ratio:16/10;background:var(--crust)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:6px;bottom:6px;background:#11111bd9;color:var(--sub);font:11px var(--mono);padding:2px 7px;border-radius:6px}
.meta{padding:7px 9px 9px}
.t{font-size:13.5px;line-height:1.25;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.s{font-size:11.5px;color:var(--muted);margin-top:3px}
.tg{font-size:11px;color:var(--teal);opacity:.8;margin-top:3px}
#empty{color:var(--muted);text-align:center;margin-top:48px}
#empty svg{display:block;margin:0 auto 10px;opacity:.7}
#viewer{position:fixed;inset:0;background:#0b0b12;z-index:20;display:none;flex-direction:column}
#viewer.on{display:flex}
#vbar{display:flex;gap:6px;align-items:center;padding:9px 10px;background:var(--mantle);border-bottom:1px solid var(--line)}
#vbar .vt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.btn{background:#1f2a3d;color:var(--text);border:1px solid #3b5278;border-radius:9px;padding:7px 11px;font:13.5px var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap}
#vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0}
#vbody img,#vbody video{max-width:100%;max-height:100%;background:#000}
#vbody iframe{width:100%;height:100%;border:0;background:var(--crust)}
#vbody audio{width:90%}
#vinfo{padding:8px 12px;font:12px var(--mono);color:var(--muted);background:var(--crust);overflow-wrap:anywhere}
footer.kccs{position:fixed;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(17,17,27,.9);border-top:1px solid var(--line);font:11px var(--sans);color:rgba(166,173,200,.6);z-index:4}
footer.kccs a{color:rgba(137,180,250,.6);text-decoration:none}
footer.kccs:hover{color:rgba(166,173,200,.9)}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:#3b5278}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><rect x="10" y="8" width="44" height="32" rx="3" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2.5"/><rect x="14" y="12" width="36" height="24" rx="1" fill="#181825"/><line x1="16" y1="25" x2="28" y2="25" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="30" x2="40" y2="30" stroke="#a6e3a1" stroke-width="2" stroke-linecap="round"/><ellipse cx="25" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#cdd6f4" stroke-width="1"/><ellipse cx="39" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#cdd6f4" stroke-width="1"/><line x1="30.5" y1="17" x2="33.5" y2="17" stroke="#cdd6f4" stroke-width="1"/><rect x="27" y="40" width="10" height="4" fill="#585b70"/><rect x="22" y="44" width="20" height="3" rx="1" fill="#585b70"/></svg>
    <h1 id="title">Drop</h1><span id="count"></span>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="Search title, tag, project, file" autocomplete="off" aria-label="Search">
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option><option value="old">Oldest</option>
      <option value="name">Name</option><option value="size">Largest</option>
    </select>
    <select id="proj" aria-label="Project"><option value="">All projects</option></select>
  </div>
  <div class="chips" id="kinds" role="group" aria-label="Type"></div>
  <div class="chips" id="tags" role="group" aria-label="Tags"></div>
</header>
<main><div id="list"></div>
  <div id="empty" hidden><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect x="10" y="8" width="44" height="32" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/><ellipse cx="25" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#9399b2"/><ellipse cx="39" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#9399b2"/><rect x="22" y="44" width="20" height="3" rx="1" fill="#45475a"/></svg><span id="emptymsg">Nothing matches.</span></div>
</main>
<div id="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div id="vbar">
    <button class="btn" id="vclose" aria-label="Close">&#x2715;</button>
    <button class="btn" id="vprev" aria-label="Previous">&#x2039;</button>
    <button class="btn" id="vnext" aria-label="Next">&#x203A;</button>
    <span class="vt" id="vtitle"></span>
    <button class="btn" id="vlink">Link</button>
    <a class="btn" id="vopen" target="_blank" rel="noopener noreferrer">Open</a>
    <a class="btn" id="vdl" download>Save</a>
  </div>
  <div id="vbody"></div>
  <div id="vinfo"></div>
</div>
<footer class="kccs"><span>Drop</span><span>&middot;</span><span>&copy; <span id="yr">2026</span> KCCS</span><span>&middot;</span><a href="https://kccsonline.com" target="_blank" rel="noopener noreferrer">kccsonline.com</a></footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=b=>b>=1e9?(b/1e9).toFixed(1)+" GB":b>=1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
const dur=s=>s?Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0"):"";
const okId=id=>/^[0-9a-f]{10}$/.test(id);
const url=(m,f)=>"i/"+m.id+"/"+encodeURIComponent(f||m.file);
$("yr").textContent=new Date().getFullYear();
let items=[],shown=[],kind="",tag="",cur=-1;
async function load(){
  let title="Drop";
  try{const r=await fetch("index.json?"+Date.now(),{cache:"no-store"});const j=await r.json();
    items=(j.items||[]).filter(i=>okId(i.id));if(j.title)title=j.title;}
  catch(e){items=[];$("emptymsg").textContent="Could not load index.json."}
  $("title").textContent=title;document.title=title;
  const ps=[...new Set(items.map(i=>i.project).filter(Boolean))].sort();
  $("proj").innerHTML='<option value="">All projects</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join("");
  render();
  const h=decodeURIComponent(location.hash.slice(1));
  if(h){const m=items.find(i=>i.id===h);if(m)openItem(m,true)}
}
function chips(el,vals,curv,set){
  el.innerHTML=vals.map(v=>`<button class="chip${v===curv?" on":""}" data-v="${esc(v)}" aria-pressed="${v===curv}">${esc(v)}</button>`).join("");
  el.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v===undefined)return;set(v===curv?"":v);render()};
}
function render(){
  const q=$("q").value.trim().toLowerCase(),pr=$("proj").value,so=$("sort").value;
  let l=items.filter(i=>(!kind||i.kind===kind)&&(!tag||(i.tags||[]).includes(tag))&&(!pr||i.project===pr)&&
    (!q||[i.title,i.file,i.project,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));
  $("count").textContent=l.length+" / "+items.length;
  chips($("kinds"),[...new Set(items.map(i=>i.kind))].sort(),kind,v=>kind=v);
  chips($("tags"),[...new Set(items.flatMap(i=>i.tags||[]))].sort(),tag,v=>tag=v);
  l.sort((a,b)=>so==="old"?a.date.localeCompare(b.date):so==="name"?a.title.localeCompare(b.title):so==="size"?b.size-a.size:b.date.localeCompare(a.date));
  shown=l;
  $("empty").hidden=l.length>0;
  let h="",last="";
  const grouped=so==="new"||so==="old";
  for(const i of l){
    const mo=i.date.slice(0,7);
    if(grouped&&mo!==last){h+=(last?"</div>":"")+`<h2>${esc(mo)}</h2><div class="grid">`;last=mo}
    else if(!grouped&&!last){h+='<div class="grid">';last="x"}
    const tg=i.tags||[];
    h+=`<button class="card" data-id="${i.id}"><div class="th"><img loading="lazy" src="${url(i,"thumb.jpg")}" alt=""><span class="badge">${esc(i.kind)}${i.dur?" "+dur(i.dur):""}</span></div>
    <div class="meta"><div class="t">${esc(i.title)}</div><div class="s">${esc(i.date.slice(0,10))} · ${fmt(i.size)}${i.project?" · "+esc(i.project):""}</div>${tg.length?`<div class="tg">#${tg.map(esc).join(" #")}</div>`:""}</div></button>`;
  }
  $("list").innerHTML=h+(last?"</div>":"");
}
$("list").onclick=e=>{const c=e.target.closest(".card");if(c)openItem(items.find(i=>i.id===c.dataset.id))};
["q","sort","proj"].forEach(id=>$(id).addEventListener("input",render));
function openItem(m,fromHash){
  if(!m)return;const u=url(m);let b="";
  cur=shown.indexOf(m);
  if(m.kind==="image")b=`<img src="${u}" alt="${esc(m.title)}">`;
  else if(m.kind==="video")b=`<video src="${u}" controls playsinline preload="metadata" poster="${url(m,"thumb.jpg")}"></video>`;
  else if(m.kind==="audio")b=`<audio src="${u}" controls></audio>`;
  else if(m.kind==="pdf"||m.kind==="html"||m.kind==="text")b=`<iframe src="${u}" title="${esc(m.title)}"></iframe>`;
  else b=`<div style="text-align:center"><img src="${url(m,"thumb.jpg")}" alt=""><p>No preview. Use Save.</p></div>`;
  $("vbody").innerHTML=b;$("vtitle").textContent=m.title;$("vopen").href=u;$("vdl").href=u;$("vdl").setAttribute("download",m.file);
  $("vinfo").textContent=m.file+" · "+fmt(m.size)+" · "+m.date.replace("T"," ")+((m.tags||[]).length?" · #"+m.tags.join(" #"):"")+(m.project?" · "+m.project:"");
  const wasOpen=$("viewer").classList.contains("on");
  $("viewer").classList.add("on");
  if(!wasOpen&&!fromHash)history.pushState({v:1},"","#"+m.id);
  else history.replaceState(history.state,"","#"+m.id);
  $("vclose").focus();
}
function step(d){if(cur<0||!shown.length)return;openItem(shown[(cur+d+shown.length)%shown.length])}
function closeV(){$("viewer").classList.remove("on");$("vbody").innerHTML="";cur=-1;
  if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
$("vclose").onclick=()=>{if(history.state&&history.state.v)history.back();else closeV()};
$("vprev").onclick=()=>step(-1);$("vnext").onclick=()=>step(1);
$("vlink").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("vlink").textContent="Copied"}catch(e){$("vlink").textContent="#"+(shown[cur]||{}).id}
  setTimeout(()=>$("vlink").textContent="Link",1500)};
addEventListener("popstate",()=>{if($("viewer").classList.contains("on"))closeV()});
addEventListener("keydown",e=>{if(!$("viewer").classList.contains("on"))return;
  if(e.key==="Escape")$("vclose").click();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});
load();
</script>
</body>
</html>

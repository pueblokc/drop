<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="How Drop works: client uploads over SSH, server makes thumbnails and an index, nginx serves it behind an access layer to your phone">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#89b4fa"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#6c7086"/>
    </marker>
    <style>
      .h{font:600 21px Inter,'Segoe UI',system-ui,-apple-system,sans-serif;fill:#cdd6f4}
      .b{font:16px Inter,'Segoe UI',system-ui,-apple-system,sans-serif;fill:#bac2de}
      .m{font:14px 'JetBrains Mono','Cascadia Code',Consolas,ui-monospace,monospace;fill:#9399b2}
      .k{font:600 12px 'JetBrains Mono','Cascadia Code',Consolas,ui-monospace,monospace;fill:#89b4fa;letter-spacing:1.5px}
      .box{fill:#181825;stroke:#313244;stroke-width:1.5}
      .inner{fill:#1e1e2e;stroke:#313244}
    </style>
  </defs>
  <rect width="1280" height="560" rx="18" fill="#11111b"/>
  <rect x=".5" y=".5" width="1279" height="559" rx="18" fill="none" stroke="#313244"/>
  <text x="40" y="52" class="h" style="font-size:26px">How Drop works</text>
  <text x="40" y="80" class="b" style="fill:#9399b2">Uploads go over SSH. Viewing goes through an access layer. Nothing is public.</text>

  <!-- 1 client -->
  <rect x="40" y="120" width="270" height="250" rx="14" class="box"/>
  <text x="60" y="150" class="k">1 · SEND</text>
  <text x="60" y="182" class="h">Your AI or script</text>
  <text x="60" y="212" class="b">Claude Code, Codex,</text>
  <text x="60" y="234" class="b">cron jobs, CI, you</text>
  <rect x="58" y="260" width="234" height="40" rx="8" class="inner"/>
  <text x="72" y="286" class="m"><tspan fill="#a6e3a1">drop</tspan> chart.png</text>
  <text x="60" y="332" class="m">--tag  --project</text>
  <text x="60" y="354" class="m">--json for agents</text>

  <path d="M318 245 H392" stroke="#89b4fa" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="355" y="232" text-anchor="middle" class="m">SFTP</text>

  <!-- 2 server -->
  <rect x="400" y="120" width="330" height="250" rx="14" class="box"/>
  <text x="420" y="150" class="k">2 · STORE</text>
  <text x="420" y="182" class="h">Drop server</text>
  <text x="420" y="210" class="b">any small Debian box</text>
  <rect x="418" y="226" width="294" height="62" rx="8" class="inner"/>
  <text x="432" y="252" class="m"><tspan fill="#cdd6f4">drop-ingest</tspan></text>
  <text x="432" y="274" class="m">thumbs · ffmpeg · dedupe</text>
  <rect x="418" y="298" width="294" height="54" rx="8" class="inner"/>
  <text x="432" y="321" class="m"><tspan fill="#cdd6f4">nginx</tspan> 127.0.0.1:8080</text>
  <text x="432" y="341" class="m">static gallery + index.json</text>

  <path d="M738 245 H812" stroke="#89b4fa" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- 3 access -->
  <rect x="820" y="120" width="190" height="250" rx="14" class="box" style="stroke:#45475a"/>
  <text x="840" y="150" class="k">3 · LOCK</text>
  <text x="840" y="182" class="h">Access layer</text>
  <g transform="translate(840 206)">
    <rect width="150" height="34" rx="17" fill="#1e1e2e" stroke="#94e2d5" stroke-opacity=".6"/>
    <text x="75" y="23" text-anchor="middle" class="b" style="font-size:15px">Cloudflare Access</text>
  </g>
  <text x="915" y="266" text-anchor="middle" class="m">or</text>
  <g transform="translate(840 280)">
    <rect width="150" height="34" rx="17" fill="#1e1e2e" stroke="#94e2d5" stroke-opacity=".6"/>
    <text x="75" y="23" text-anchor="middle" class="b" style="font-size:15px">Tailscale Serve</text>
  </g>
  <!-- lock icon -->
  <g transform="translate(962 136)" fill="none" stroke="#94e2d5" stroke-width="2">
    <rect x="0" y="12" width="22" height="17" rx="3"/>
    <path d="M5 12 v-5 a6 6 0 0 1 12 0 v5"/>
  </g>

  <path d="M1018 245 H1092" stroke="#89b4fa" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- 4 phone -->
  <rect x="1100" y="120" width="140" height="250" rx="14" class="box"/>
  <text x="1120" y="150" class="k">4 · LOOK</text>
  <rect x="1132" y="166" width="76" height="148" rx="12" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2"/>
  <rect x="1140" y="180" width="28" height="22" rx="4" fill="#313244"/>
  <rect x="1172" y="180" width="28" height="22" rx="4" fill="#45475a"/>
  <rect x="1140" y="206" width="28" height="22" rx="4" fill="#45475a"/>
  <rect x="1172" y="206" width="28" height="22" rx="4" fill="#313244"/>
  <rect x="1140" y="232" width="60" height="40" rx="4" fill="#313244"/>
  <rect x="1158" y="300" width="24" height="4" rx="2" fill="#585b70"/>
  <text x="1170" y="346" text-anchor="middle" class="b">phone · laptop</text>

  <!-- optional extras -->
  <path d="M175 378 V470 H392" stroke="#6c7086" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arm)"/>
  <rect x="400" y="440" width="330" height="70" rx="12" class="box" style="stroke-dasharray:6 5"/>
  <text x="420" y="470" class="b"><tspan fill="#cdd6f4" font-weight="600">Optional mirror</tspan> · rclone</text>
  <text x="420" y="494" class="m">Google Drive, S3, B2, ...</text>

  <path d="M738 475 H812" stroke="#6c7086" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arm)"/>
  <rect x="820" y="440" width="420" height="70" rx="12" class="box" style="stroke-dasharray:6 5"/>
  <text x="840" y="470" class="b"><tspan fill="#cdd6f4" font-weight="600">Optional ping</tspan> with the links</text>
  <text x="840" y="494" class="m">Telegram · ntfy · any webhook</text>
</svg>

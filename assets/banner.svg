<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Drop by KCCS - the outbox for your AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="18" fill="none" stroke="#313244"/>

  <!-- dotted grid, very faint -->
  <g fill="#313244" opacity=".55">
    <circle cx="80" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="160" cy="60" r="1.5"/>
    <circle cx="80" cy="100" r="1.5"/><circle cx="120" cy="100" r="1.5"/><circle cx="160" cy="100" r="1.5"/>
    <circle cx="1120" cy="300" r="1.5"/><circle cx="1160" cy="300" r="1.5"/><circle cx="1200" cy="300" r="1.5"/>
    <circle cx="1120" cy="340" r="1.5"/><circle cx="1160" cy="340" r="1.5"/><circle cx="1200" cy="340" r="1.5"/>
  </g>

  <!-- KCCS sunglasses monitor, large -->
  <g transform="translate(96 78) scale(3.6)">
    <rect x="10" y="8" width="44" height="32" rx="3" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.6"/>
    <rect x="14" y="12" width="36" height="24" rx="1" fill="#181825"/>
    <line x1="16" y1="25" x2="28" y2="25" stroke="#89b4fa" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="16" y1="30" x2="40" y2="30" stroke="#a6e3a1" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="36" y="19" width="1.6" height="3" fill="#a6e3a1"/>
    <ellipse cx="25" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#cdd6f4" stroke-width=".8"/>
    <ellipse cx="39" cy="17" rx="5.5" ry="3.3" fill="#11111b" stroke="#cdd6f4" stroke-width=".8"/>
    <line x1="30.5" y1="17" x2="33.5" y2="17" stroke="#cdd6f4" stroke-width=".8"/>
    <path d="M29 22 Q32 23.6 35 22" fill="none" stroke="#f9e2af" stroke-width=".8" stroke-linecap="round"/>
    <rect x="27" y="40" width="10" height="4" fill="#585b70"/>
    <rect x="22" y="44" width="20" height="3" rx="1" fill="#585b70"/>
  </g>

  <!-- the drop: files falling from the screen into a tray -->
  <rect x="211" y="250" width="3" height="58" fill="url(#fade)"/>
  <g>
    <rect x="186" y="300" width="54" height="40" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2"/>
    <polyline points="192,332 204,318 214,326 224,312 234,332" fill="none" stroke="#94e2d5" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <path d="M150 334 h20 l10 22 h66 l10 -22 h20" fill="none" stroke="#45475a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="430" y="190" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="112" font-weight="700" fill="#cdd6f4" letter-spacing="-2">Drop</text>
  <text x="434" y="244" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="30" fill="#bac2de">The outbox for your AI assistant.</text>
  <text x="434" y="286" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="21" fill="#9399b2">One command sends a file to a private, phone-friendly gallery.</text>

  <!-- command chip -->
  <g transform="translate(434 312)">
    <rect width="470" height="44" rx="10" fill="#11111b" stroke="#313244"/>
    <text x="18" y="29" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, ui-monospace, monospace" font-size="19" fill="#9399b2">$ <tspan fill="#a6e3a1">drop</tspan><tspan fill="#cdd6f4"> report.html</tspan><tspan fill="#cba6f7"> --tag ops</tspan></text>
  </g>

  <!-- tiny gallery preview, right -->
  <g transform="translate(980 64)">
    <rect width="232" height="200" rx="14" fill="#181825" stroke="#313244"/>
    <rect x="14" y="14" width="96" height="62" rx="8" fill="#1e1e2e"/>
    <rect x="122" y="14" width="96" height="62" rx="8" fill="#1e1e2e"/>
    <rect x="14" y="88" width="96" height="62" rx="8" fill="#1e1e2e"/>
    <rect x="122" y="88" width="96" height="62" rx="8" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2"/>
    <g fill="#45475a"><rect x="24" y="52" width="8" height="16"/><rect x="36" y="42" width="8" height="26"/><rect x="48" y="48" width="8" height="20"/><rect x="60" y="36" width="8" height="32"/></g>
    <rect x="72" y="30" width="8" height="38" fill="#89b4fa"/>
    <circle cx="196" cy="34" r="8" fill="#f9e2af" opacity=".75"/>
    <path d="M122 70 q24 -18 48 -6 t48 -4 v16 h-96z" fill="#313244"/>
    <polygon points="54,108 54,132 74,120" fill="#bac2de"/>
    <text x="140" y="125" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#89b4fa">HTML</text>
    <rect x="14" y="162" width="120" height="8" rx="4" fill="#313244"/>
    <rect x="14" y="178" width="76" height="8" rx="4" fill="#94e2d5" opacity=".5"/>
  </g>

  <!-- signature -->
  <text x="1212" y="370" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#6c7086">by KCCS · kccsonline.com</text>
</svg>
